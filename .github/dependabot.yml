version: 2
updates:
  # Configuración para npm (JavaScript/TypeScript), gestionado con pnpm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "ArenasAgustin"
    assignees:
      - "ArenasAgustin"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    groups:
      # react y react-dom tienen que moverse siempre juntos. Actualizar uno
      # sin el otro deja un peer mismatch que solo falla en runtime.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@testing-library/react"
      # Agrupar actualizaciones menores y parches
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Las majors de React son una migración manual y deliberada.
      # react-dom tiene que estar ignorado junto con react: si no,
      # Dependabot abre una PR de react-dom sola y las versiones se separan.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # GitHub Actions (para mantener actualizadas las actions)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "github-actions"
      - "dependencies"
